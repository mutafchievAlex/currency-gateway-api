openapi: 3.0.3
info:
  title: Currency Gateway JSON API
  version: 1.0.0
servers:
  - url: /
paths:
  /json_api/current:
    get:
      tags:
        - JsonApi
      operationId: getCurrentRate
      summary: Retrieve the latest exchange rate for a currency pair
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/BaseCurrency'
        - $ref: '#/components/parameters/TargetCurrency'
      responses:
        '200':
          description: Latest exchange rate found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeRateResponse'
        '404':
          description: Exchange rate not found
        '409':
          description: Duplicate request detected
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /json_api/history:
    get:
      tags:
        - JsonApi
      operationId: getHistory
      summary: Retrieve the historical exchange rate series for a currency pair
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/BaseCurrency'
        - $ref: '#/components/parameters/TargetCurrency'
        - $ref: '#/components/parameters/Start'
        - $ref: '#/components/parameters/End'
      responses:
        '200':
          description: Historical exchange rate values in ascending timestamp order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExchangeRateResponse'
        '409':
          description: Duplicate request detected
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '400':
          description: Invalid request parameters
components:
  parameters:
    RequestId:
      name: requestId
      in: query
      required: true
      description: Stable identifier for idempotent request handling
      schema:
        type: string
        minLength: 1
        maxLength: 100
    BaseCurrency:
      name: baseCurrency
      in: query
      required: true
      description: ISO-4217 code of the base currency
      schema:
        type: string
        pattern: '^[A-Za-z]{3}$'
    TargetCurrency:
      name: targetCurrency
      in: query
      required: true
      description: ISO-4217 code of the target currency
      schema:
        type: string
        pattern: '^[A-Za-z]{3}$'
    Start:
      name: start
      in: query
      required: true
      description: Inclusive start timestamp of the requested history window
      schema:
        type: string
        format: date-time
        x-java-type: java.time.Instant
    End:
      name: end
      in: query
      required: true
      description: Inclusive end timestamp of the requested history window
      schema:
        type: string
        format: date-time
        x-java-type: java.time.Instant
  schemas:
    ExchangeRateResponse:
      type: object
      required:
        - baseCurrency
        - targetCurrency
        - rate
        - timestamp
      properties:
        baseCurrency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: USD
        targetCurrency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: EUR
        rate:
          type: number
          format: bigdecimal
          example: 0.92
        timestamp:
          type: string
          format: date-time
          x-java-type: java.time.Instant
          example: 2024-03-15T10:15:30Z
    ProblemDetail:
      type: object
      description: RFC 7807 compliant problem response
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
