fixer:
  url: https://data.fixer.io/api
  api-key: ${FIXER_API_KEY}
collector:
  interval: 3600000
  base-currency: USD
  target-currencies:
    - EUR
    - GBP
    - JPY
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/currency
    username: ${DB_USERNAME:currency}
    password: ${DB_PASSWORD:currency}
    hikari:
      pool-name: CurrencyGatewayHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      validation-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
      jakarta.persistence.schema-generation.scripts.action: create
      jakarta.persistence.schema-generation.scripts.create-target: build/schema.sql
      jakarta.persistence.schema-generation.scripts.create-source: metadata
  flyway:
    enabled: false
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    template:
      exchange: ${RABBITMQ_EXCHANGE:currency.statistics}
