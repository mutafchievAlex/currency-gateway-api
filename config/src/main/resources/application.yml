fixer:
  url: https://data.fixer.io/api/latest
  api-key: ${FIXER_API_KEY}
collector:
  interval: 3600000
  base-currency: USD
  target-currencies:
    - EUR
    - GBP
    - JPY
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/currency_gateway
    username: ${DB_USERNAME:currency}
    password: ${DB_PASSWORD:currency}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    template:
      exchange: ${RABBITMQ_EXCHANGE:currency.statistics}
