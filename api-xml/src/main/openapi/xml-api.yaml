openapi: 3.0.3
info:
  title: Currency Gateway XML API
  version: 1.0.0
servers:
  - url: /
paths:
  /xml_api/command:
    post:
      tags:
        - XmlApi
      operationId: executeCommand
      summary: Execute an exchange rate command request
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/ExchangeRateCommandRequest'
      responses:
        '200':
          description: Command executed successfully
          content:
            application/xml:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ExchangeRateResponse'
                  - $ref: '#/components/schemas/ExchangeRateHistoryResponse'
        '400':
          description: Invalid command payload
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Requested resource was not found
        '409':
          description: Duplicate request detected
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ExchangeRateCommandRequest:
      type: object
      xml:
        name: exchangeRateCommand
      required:
        - requestId
        - type
        - baseCurrency
        - targetCurrency
      properties:
        requestId:
          type: string
          minLength: 1
          maxLength: 100
        type:
          type: string
          description: Type of command being requested
          enum:
            - CURRENT
            - HISTORY
        baseCurrency:
          type: string
          pattern: '^[A-Za-z]{3}$'
        targetCurrency:
          type: string
          pattern: '^[A-Za-z]{3}$'
        start:
          type: string
          format: date-time
          nullable: true
          x-java-type: java.time.Instant
        end:
          type: string
          format: date-time
          nullable: true
          x-java-type: java.time.Instant
    ExchangeRateResponse:
      type: object
      xml:
        name: exchangeRateResponse
      required:
        - baseCurrency
        - targetCurrency
        - rate
        - timestamp
      properties:
        baseCurrency:
          type: string
          pattern: '^[A-Z]{3}$'
        targetCurrency:
          type: string
          pattern: '^[A-Z]{3}$'
        rate:
          type: number
          format: bigdecimal
        timestamp:
          type: string
          format: date-time
          x-java-type: java.time.Instant
    ExchangeRateHistoryResponse:
      type: object
      xml:
        name: exchangeRateHistoryResponse
      properties:
        rates:
          type: array
          xml:
            name: rates
            wrapped: true
          items:
            $ref: '#/components/schemas/ExchangeRateResponse'
            xml:
              name: rate
    ErrorResponse:
      type: object
      xml:
        name: error
      required:
        - title
        - detail
        - status
      properties:
        title:
          type: string
        detail:
          type: string
        status:
          type: integer
          format: int32
