openapi: 3.0.3
info:
  title: Currency Gateway JSON API
  version: 1.1.0
  description: JSON endpoints for exchange rate data backed by Fixer
paths:
  /json_api/current:
    post:
      tags:
        - JsonExchangeRates
      operationId: getCurrentExchangeRate
      summary: Retrieve the latest Fixer exchange rate for a currency pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonCurrentRequest'
      responses:
        '200':
          description: Successful JSON exchange rate response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonCurrentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /json_api/history:
    post:
      tags:
        - JsonExchangeRates
      operationId: getExchangeRateHistory
      summary: Retrieve a Fixer exchange rate history window for a currency pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonHistoryRequest'
      responses:
        '200':
          description: Historical exchange rate response in JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonHistoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    NotFound:
      description: Requested exchange rate not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Conflict:
      description: Duplicate request identifier detected
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    InternalServerError:
      description: Unexpected server-side failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
  schemas:
    JsonClientMetadata:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          description: Unique identifier for the consuming client
        name:
          type: string
          maxLength: 256
          description: Human friendly name for the client application
        version:
          type: string
          maxLength: 64
          description: Optional semantic version of the client application
    JsonCurrencyPair:
      type: object
      required:
        - base
        - target
      properties:
        base:
          type: string
          minLength: 3
          maxLength: 3
          pattern: '^[A-Z]{3}$'
          description: ISO-4217 currency code representing the base currency
        target:
          type: string
          minLength: 3
          maxLength: 3
          pattern: '^[A-Z]{3}$'
          description: ISO-4217 currency code representing the target currency
    JsonHistoryPeriod:
      type: object
      required:
        - amount
        - unit
      properties:
        amount:
          type: integer
          minimum: 1
          maximum: 720
          description: Positive quantity of the selected period unit to look back from the timestamp
        unit:
          type: string
          description: Period unit used to calculate the history window
          enum:
            - MINUTES
            - HOURS
            - DAYS
    JsonQuote:
      type: object
      required:
        - provider
        - rate
        - timestamp
      properties:
        provider:
          type: string
          enum:
            - Fixer
          description: Upstream data provider responsible for the exchange rate
        rate:
          type: string
          pattern: "^-?\\d+(?:\\.\\d+)?$"
          description: Decimal exchange rate quoted by the provider
        timestamp:
          type: string
          format: date-time
          description: Timestamp reported by the Fixer provider for the quote
    JsonCurrentRequest:
      type: object
      required:
        - requestId
        - timestamp
        - client
        - currency
      properties:
        requestId:
          type: string
          format: uuid
          description: Unique identifier supplied by the caller for idempotency guarantees
        timestamp:
          type: string
          format: date-time
          description: Client generated timestamp for the request
        client:
          $ref: '#/components/schemas/JsonClientMetadata'
        currency:
          $ref: '#/components/schemas/JsonCurrencyPair'
    JsonHistoryRequest:
      allOf:
        - $ref: '#/components/schemas/JsonCurrentRequest'
        - type: object
          required:
            - period
          properties:
            period:
              $ref: '#/components/schemas/JsonHistoryPeriod'
    JsonHistoryWindow:
      type: object
      required:
        - start
        - end
      properties:
        start:
          type: string
          format: date-time
          description: Inclusive start timestamp of the history window derived from the request period
        end:
          type: string
          format: date-time
          description: Inclusive end timestamp of the history window matching the request timestamp
    JsonCurrentResponse:
      type: object
      required:
        - requestId
        - requestedAt
        - client
        - currency
        - quote
      properties:
        requestId:
          type: string
          format: uuid
        requestedAt:
          type: string
          format: date-time
          description: Echo of the client supplied timestamp
        client:
          $ref: '#/components/schemas/JsonClientMetadata'
        currency:
          $ref: '#/components/schemas/JsonCurrencyPair'
        quote:
          $ref: '#/components/schemas/JsonQuote'
    JsonHistoryResponse:
      type: object
      required:
        - requestId
        - requestedAt
        - client
        - currency
        - period
        - window
        - quotes
      properties:
        requestId:
          type: string
          format: uuid
        requestedAt:
          type: string
          format: date-time
          description: Echo of the client supplied timestamp
        client:
          $ref: '#/components/schemas/JsonClientMetadata'
        currency:
          $ref: '#/components/schemas/JsonCurrencyPair'
        period:
          $ref: '#/components/schemas/JsonHistoryPeriod'
        window:
          $ref: '#/components/schemas/JsonHistoryWindow'
        quotes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/JsonQuote'
    ApiErrorResponse:
      type: object
      required:
        - code
        - type
        - message
      properties:
        code:
          type: integer
          format: int32
        type:
          type: string
        message:
          type: string
